# The SD card (docs/system.md, "The SD card"): U-Boot (raw), the boot partition (boot.scr, and U-Boot's
# environment, uboot.env, which it writes itself), two root slots (A and B: a base update is written to
# the one not running, then tried, then kept; bootslot), and the apps between them (p3, so a card laid
# out before the slots keeps its apps where they were: flash_sd.sh --relayout).
image boot.vfat {
  vfat {
    files = {
      "boot.scr"
    }
  }
  size = 8M
}

image sdcard.img {
  hdimage {
  }

  partition u-boot {
    in-partition-table = "no"
    image = "u-boot-sunxi-with-spl.bin"
    offset = 8192 # for partition table, etc
    size = 1040384 # 1MB - 8192
  }

  partition boot {
    partition-type = 0xC
    bootable = "true"
    image = "boot.vfat"
  }

  # root slot A
  partition rootfs {
    partition-type = 0x83
    image = "rootfs.ext4"
  }

  # the apps and their settings (/apps; see docs/apps.md), made by post-image.sh
  partition apps {
    partition-type = 0x83
    image = "apps.ext4"
  }

  # root slot B: the same system to start with
  partition rootfs-b {
    partition-type = 0x83
    image = "rootfs.ext4"
  }
}
