# EPCOT's own settings (the first time; then its countdown.conf in /apps/data/epcot)
# the wait-times board, shown in turn with the countdown: 1 on, 0 off; how long it shows (seconds)
WAITS=1
WAITS_SECS=60
# the rides it shows (Settings > Theme picks them; names joined with |): empty for all of them
RIDES=
# the park (a ThemeParks.wiki entity id), if not app.json's "park"
PARK=
