# A countdown app's settings: /apps/data/<app>/countdown.conf on the board, started the first time
# from this file (the settings every countdown app has) and the app's own defaults.conf. KEY=VALUE lines.

# the day the countdown runs to (YYYY-MM-DD)
TRIP_DATE=2027-02-16
# which of the app's scenes (a folder in its scenes/); empty for its own default
THEME=
# cabin windows switching on or off, per minute (at night)
LIGHTS_PER_MIN=90
# fireworks (Settings > Fireworks sets these): random (a few rockets now and then through the night),
# show (a two-minute show every night at FIREWORKS_SHOW_TIME), both, or off
FIREWORKS_MODE=random
# random bursts about this often, at night (minutes, on average)
FIREWORKS_EVERY_MIN=15
# the nightly show's time (24-hour HH:MM)
FIREWORKS_SHOW_TIME=21:00
# how long the countdown shows between the app's own screens (seconds)
COUNTDOWN_SECS=60
# dither for the 18-bit panel (smooth gradients without banding): 1 on, 0 off
DITHER=1
# CPU clock in MHz, set when this app starts. Empty: leave it as the base system set it at boot
# (600; /apps/data/cpu_mhz overrides that for every app). Check the log's "self-check" lines.
CPU_MHZ=

# touchscreen calibration: raw readings (0-4095) at the screen edges, measured on the 5" panel.
# Settings > Calibrate touch measures and saves these (swap a pair to flip an axis; TOUCH_SWAP_XY=1
# if x and y are crossed)
TOUCH_X_MIN=161
TOUCH_X_MAX=4015
TOUCH_Y_MIN=298
TOUCH_Y_MAX=4122
TOUCH_SWAP_XY=0
