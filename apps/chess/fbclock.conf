# Settings for the chess clock (/apps/data/chess/fbclock.conf on the board, started from this
# file the first time it runs), and its touchscreen calibration.
#
# Values below were measured on the 5" 800x480 panel this board shipped with.
# Resistive panels report raw positions 0..4095 that rarely line up exactly
# with the screen edges. To calibrate:
#   app stop
#   cd /apps/chess && python3 fbclock.py --touch-debug
# tap near each corner, note the raw x/y values, then fill them in below
# (if an axis comes out backwards, swap that axis's MIN and MAX values) and
# run: app start
TOUCH_X_MIN=44
TOUCH_X_MAX=4119
TOUCH_Y_MIN=-121
TOUCH_Y_MAX=4370
# set to 1 if moving your finger left/right changes the raw y value
TOUCH_SWAP_XY=0
